; Per-host settings (modules-right, extra modules), from hosts/<host>/.config/polybar/host.ini
include-file = host.ini

[colors]
background = #000000
background-alt = #001d5f
foreground = #F7F7F7
primary = #D7D7D7
secondary = #D7D7D7
alert = #009A9A
disabled = rgb(103, 103, 103)

[bar/top]

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3
override-redirect = true
width = 99%
height = 35pt
bottom = true
offset-x = 0.5%
offset-y = 0.5%

dpi = 150

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1pt

radius = 10pt
border-size = 0pt
border-color = #A0A0A0

padding-left = 0 
padding-right = 1

module-margin = 1

font-0 = MesloLGS NF;5

separator = "|"
separator-foreground = ${colors.foreground}

modules-left = xworkspaces xwindow
modules-right = ${host.modules-right}

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; [module/tray]
; type = internal/tray
; 
; tray-spacing = 16pt
; tray-position = center
; 
[module/xworkspaces] 
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= #DD0000
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/text]

type = curtom/text
format = default
label = some label


[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

# [module/filesystem]
# type = internal/fs
# interval = 25
# 
# mount-0 = /
# 
# label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%
# 
# label-unmounted = %mountpoint% not mounted
# label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = 󰖁 muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = custom/script
exec = ~/.config/polybar/scripts/memory_usage.sh
interval = 2

[module/cpu]
type = custom/script
exec = ~/.config/polybar/scripts/cpu_active_cores.sh
interval = 2

[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/nvidia.sh
format-prefix = " "
format-prefix-foreground = ${colors.primary}
interval = 2


[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

# [module/wlan]
# inherit = network-base
# interface-type = wireless
# label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
# label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

# [module/date]
# type = internal/date
# interval = 1
# s
# date = %H:%M
# date-alt = %Y-%m-%d %H:%M:%S
# 
# label = %date%
# label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
