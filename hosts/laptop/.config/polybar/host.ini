; Laptop-specific polybar settings (installed by ./install.py laptop)
[host]
dpi = 150
modules-right = filesystem pulseaudio battery xkeyboard memory cpu gpu wlan date

[module/battery]
type = internal/battery
; Check names with: ls /sys/class/power_supply
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.primary}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.primary}
animation-charging-framerate = 750

; Wi-Fi only (the laptop has no wired module). Check the interface with: ip link
[module/wlan]
inherit = network-base
interface-type = wireless
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid%
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.disabled}
label-disconnected = disconnected
label-disconnected-foreground = ${colors.disabled}
