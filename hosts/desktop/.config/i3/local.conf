# Desktop-specific i3 settings (installed by ./install.py desktop)

# Pin workspaces to monitors
workspace $ws1 output DP-0
workspace $ws2 output DP-0
workspace $ws3 output DP-0
workspace $ws4 output DP-0
workspace $ws5 output DP-5
workspace $ws6 output DP-5

# apply hv and hh screen layout and restore wallpaper
bindsym $mod+Shift+v exec --no-startup-id sh -c "~/.config/i3/screenlayout/hv.sh && feh --bg-fill ~/.config/i3/background.jpg"
bindsym $mod+Shift+h exec --no-startup-id sh -c "~/.config/i3/screenlayout/hh.sh && feh --bg-fill ~/.config/i3/background.jpg"
